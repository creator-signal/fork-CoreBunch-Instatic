name: CI

on:
  pull_request:
    branches:
      - creator-signal/develop
      - creator-signal/main
      - develop
      - main
  push:
    branches:
      - creator-signal/develop
      - creator-signal/main
      - develop
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run build` is `tsc -b && vite build` — typecheck and bundle in one.
      - name: Build
        run: bun run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

  creator-signal-plugin:
    name: Creator Signal Site Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Creator Signal Design System lock
        run: bun run creator-signal:design-system:check

      - name: Lint site pack
        run: bun run instatic-plugin lint integrations/creator-signal

      - name: Build site pack
        run: bun run instatic-plugin build integrations/creator-signal

      - name: Install browser for Design System acceptance
        run: bunx playwright install --with-deps chromium

      - name: Verify Design System in a browser
        run: bun run verify:creator-signal-design-system:browser

      - name: Verify published public-site acceptance
        run: bun run verify:creator-signal-public-acceptance

      - name: Upload public-site acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-signal-public-acceptance
          path: .tmp/creator-signal-public-acceptance
          if-no-files-found: warn

      - name: Upload comparison plugin
        uses: actions/upload-artifact@v4
        with:
          name: creator-signal-site-plugin
          path: integrations/creator-signal.plugin.zip
          if-no-files-found: error

  creator-signal-images:
    name: Creator Signal Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Instatic runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: creator-signal-instatic:ci

      - name: Build MinIO media edge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/creator-signal-media-edge/Dockerfile
          push: false
          tags: creator-signal-instatic-media-edge:ci

# NOTE: The Playwright E2E suite is intentionally NOT run in CI yet. As
# configured (`workers: 1`, fully serial, 156 tests) it takes ~45-60 min and is
# timeout-fragile against the un-optimized dev server, so it cannot gate PRs
# reliably today. Run it locally with `bun run test:e2e`. It will be reintroduced
# as its own workflow once the suite is sharded/parallelized and stabilized.
