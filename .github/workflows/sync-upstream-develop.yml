name: Sync upstream develop mirror

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Fast-forward develop from CoreBunch main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creator Signal repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fast-forward upstream mirror
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/CoreBunch/Instatic.git
        run: |
          git remote add upstream-source "$UPSTREAM_URL"
          git fetch --no-tags upstream-source main
          git fetch --no-tags origin develop

          upstream_sha="$(git rev-parse upstream-source/main)"
          mirror_sha="$(git rev-parse origin/develop)"

          if [ "$mirror_sha" = "$upstream_sha" ]; then
            echo "develop already mirrors fork-origin/main at $upstream_sha"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$mirror_sha" "$upstream_sha"; then
            echo "::error::CoreBunch main is not a fast-forward of origin/develop. Review upstream history before changing the mirror."
            exit 1
          fi

          git push origin "$upstream_sha:refs/heads/develop"

          published_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$published_sha" = "$upstream_sha"
